name: Finish visible punctuation audit

on:
  push:
    branches:
      - main
    paths:
      - .github/finish-visible-punctuation.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply final punctuation audit
        run: python .github/scripts/finish_visible_punctuation_audit.py

      - name: Remove one-shot files
        run: |
          rm -f .github/finish-visible-punctuation.trigger
          rm -f .github/scripts/finish_visible_punctuation_audit.py
          rm -f .github/workflows/finish-visible-punctuation-audit.yml

      - name: Commit final punctuation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish visible punctuation audit"
          git push
