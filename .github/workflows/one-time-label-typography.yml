name: One-time label typography refinement

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-label-typography.yml"

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine label typography
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("index.html")
          css_path = Path("styles.css")
          html = html_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          css = replace_once(
              css,
              "/* Blue Continuum 4.2.2 — Consolidated portfolio stylesheet */",
              "/* Blue Continuum 4.2.3 — Consolidated portfolio stylesheet */",
              "stylesheet version",
          )

          css = replace_once(
              css,
              """.eyebrow {
            margin: 0 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #a7bac2;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            line-height: 1.2;
            text-transform: capitalize;
          }""",
              """.eyebrow {
            margin: 0 0 13px;
            display: flex;
            align-items: center;
            gap: 9px;
            color: #a5b8c0;
            font-size: 0.64rem;
            font-weight: 820;
            letter-spacing: 0.17em;
            line-height: 1.3;
            text-transform: uppercase;
          }

          .hero-copy > .eyebrow {
            width: fit-content;
            margin-bottom: 8px;
            padding-left: 2px;
            color: #bacacf;
            font-size: 0.7rem;
            font-weight: 730;
            letter-spacing: 0.075em;
            text-transform: none;
          }

          .hero-copy > .eyebrow::after {
            content: "";
            width: 28px;
            height: 1px;
            flex: 0 0 28px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(174, 196, 203, 0.72), rgba(174, 196, 203, 0));
            box-shadow: 0 0 14px rgba(145, 169, 178, 0.08);
          }""",
              "eyebrow system",
          )

          css = replace_once(
              css,
              """.timeline-state {
            margin: 24px 0 0;
            color: rgb(var(--accent-rgb));
            font-size: 0.58rem;
            font-weight: 820;
            letter-spacing: 0.14em;
            text-transform: capitalize;
          }""",
              """.timeline-state {
            display: inline-flex;
            align-self: flex-start;
            margin: 24px 0 0;
            padding: 0;
            border: 0;
            color: rgb(var(--accent-rgb));
            background: transparent;
            font-size: 0.58rem;
            font-weight: 820;
            letter-spacing: 0.14em;
            line-height: 1.3;
            text-transform: uppercase;
          }""",
              "journey state typography",
          )

          replacements = {
              "text-transform: capitalize;\n}\n\n.facts dt::before": "text-transform: uppercase;\n}\n\n.facts dt::before",
              "text-transform: capitalize;\n}\n\n.workshop-entry-title": "text-transform: uppercase;\n}\n\n.workshop-entry-title",
              "text-transform: capitalize;\n}\n\n.status,\n.tags li": "text-transform: uppercase;\n}\n\n.status,\n.tags li",
              "text-transform: capitalize; }\n.footer-copyright": "text-transform: uppercase; }\n.footer-copyright",
              "text-transform: capitalize;\n}\n\n.workshop-back": "text-transform: uppercase;\n}\n\n.workshop-back",
              "text-transform: capitalize;\n}\n\n.workshop-updated-divider": "text-transform: uppercase;\n}\n\n.workshop-updated-divider",
              "text-transform: capitalize;\n}\n\n.workshop-card h3": "text-transform: uppercase;\n}\n\n.workshop-card h3",
              ".hero .eyebrow { justify-content: center; }": ".hero .eyebrow { justify-content: center; margin-inline: auto; }",
          }

          for old, new in replacements.items():
              css = replace_once(css, old, new, old.splitlines()[0])

          html = replace_once(
              html,
              'href="styles.css?v=4.2.2"',
              'href="styles.css?v=4.2.3"',
              "stylesheet cache version",
          )
          html = replace_once(
              html,
              '<p class="footer-version">Version 4.2.2</p>',
              '<p class="footer-version">Version 4.2.3</p>',
              "footer version",
          )

          if css.count("text-transform: uppercase;") < 8:
              raise SystemExit("metadata uppercase audit failed")
          if "text-transform: none;" not in css:
              raise SystemExit("hero eyebrow exception missing")
          if css.count("{") != css.count("}"):
              raise SystemExit("CSS braces are unbalanced")
          if html.count("<section") != html.count("</section>"):
              raise SystemExit("HTML section tags are unbalanced")

          css_path.write_text(css, encoding="utf-8")
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Install visual QA tooling
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

      - name: Run responsive visual QA
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import time
          from playwright.sync_api import sync_playwright

          output = Path("qa-output")
          output.mkdir(exist_ok=True)
          server = subprocess.Popen(
              ["python3", "-m", "http.server", "4173", "--bind", "127.0.0.1"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          time.sleep(1.2)

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  for name, width, height in (
                      ("desktop", 1440, 1000),
                      ("mobile", 390, 844),
                  ):
                      page = browser.new_page(viewport={"width": width, "height": height})
                      page.goto("http://127.0.0.1:4173", wait_until="networkidle")
                      page.evaluate("document.fonts.ready")
                      page.evaluate("document.activeElement && document.activeElement.blur()")

                      checks = page.evaluate("""
                      () => {
                        const style = (selector) => getComputedStyle(document.querySelector(selector));
                        const hero = style('.hero-copy > .eyebrow');
                        const section = style('#about .eyebrow');
                        const timeline = style('.timeline-state');
                        const workshop = style('.workshop-state');
                        const heroBox = document.querySelector('.hero-copy > .eyebrow').getBoundingClientRect();
                        const titleBox = document.querySelector('.hero h1').getBoundingClientRect();
                        return {
                          overflow: document.documentElement.scrollWidth - window.innerWidth,
                          heroText: document.querySelector('.hero-copy > .eyebrow').textContent.trim(),
                          heroTransform: hero.textTransform,
                          sectionTransform: section.textTransform,
                          timelineTransform: timeline.textTransform,
                          workshopTransform: workshop.textTransform,
                          timelineSize: timeline.fontSize,
                          workshopSize: workshop.fontSize,
                          timelineWeight: timeline.fontWeight,
                          workshopWeight: workshop.fontWeight,
                          timelineSpacing: timeline.letterSpacing,
                          workshopSpacing: workshop.letterSpacing,
                          heroGap: titleBox.top - heroBox.bottom,
                        };
                      }
                      """)

                      assert checks["overflow"] <= 1, checks
                      assert checks["heroText"] == "Hello, I’m", checks
                      assert checks["heroTransform"] == "none", checks
                      assert checks["sectionTransform"] == "uppercase", checks
                      assert checks["timelineTransform"] == "uppercase", checks
                      assert checks["workshopTransform"] == "uppercase", checks
                      assert checks["timelineSize"] == checks["workshopSize"], checks
                      assert checks["timelineWeight"] == checks["workshopWeight"], checks
                      assert checks["timelineSpacing"] == checks["workshopSpacing"], checks
                      assert 3 <= checks["heroGap"] <= 18, checks

                      page.locator(".hero").screenshot(path=output / f"{name}-hero.png")
                      page.locator("#about").screenshot(path=output / f"{name}-about.png")
                      page.locator("#journey").screenshot(path=output / f"{name}-journey.png")

                      page.locator("[data-open-workshop]").click()
                      page.wait_for_timeout(450)
                      page.locator('[aria-labelledby="current-title"]').scroll_into_view_if_needed()
                      page.wait_for_timeout(200)
                      page.locator('[aria-labelledby="current-title"]').screenshot(
                          path=output / f"{name}-workshop-current.png"
                      )
                      page.close()
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-typography-qa
          path: qa-output
          if-no-files-found: warn

      - name: Commit refinement and remove temporary files
        run: |
          rm -rf qa-output
          rm -f .github/workflows/one-time-label-typography.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine label typography and hero introduction"
          git push
