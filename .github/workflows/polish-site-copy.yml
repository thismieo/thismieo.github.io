name: Polish site copy

on:
  push:
    branches:
      - main
    paths:
      - .github/polish-site-copy.trigger

permissions:
  contents: write

concurrency:
  group: polish-site-copy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove legacy closing selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("styles.css")
          text = path.read_text(encoding="utf-8")
          old = ".hero-tagline span,\n.hero-intro span,\n.closing-message span { display: inline; }"
          new = ".hero-tagline span,\n.hero-intro span { display: inline; }"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Legacy closing selector: expected one match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply guarded copy polish
        run: python .github/scripts/polish_site_copy.py

      - name: Remove one-shot files
        if: success()
        run: |
          rm -f .github/polish-site-copy.trigger
          rm -f .github/scripts/polish_site_copy.py
          rm -f .github/workflows/polish-site-copy.yml

      - name: Commit polished copy
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish visible site copy and punctuation"
          git push
