name: Finalize portfolio v2.0

on:
  push:
    branches: [main]
    paths:
      - '.deploy/**'
      - '.github/workflows/deploy-v2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged deployment
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct audited release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-release
          cat .deploy/part-*.b64 | base64 --decode > /tmp/portfolio-v2.tar.gz
          echo "9a4e0a3bacb41d237a8138d017d858d7c8aa588b05d713b7ef1090224b3982c2  /tmp/portfolio-v2.tar.gz" | sha256sum -c -
          tar -xzf /tmp/portfolio-v2.tar.gz -C /tmp/portfolio-release

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'assets' \
            ! -name '.deploy' \
            ! -name '.github' \
            -exec rm -rf {} +

          mkdir -p assets
          find assets -mindepth 1 -maxdepth 1 -type f \
            ! -name 'apple-touch-icon.png' \
            ! -name 'favicon-192.png' \
            ! -name 'favicon-32.png' \
            ! -name 'favicon-512.png' \
            ! -name 'favicon.ico' \
            ! -name 'favicon.svg' \
            ! -name 'manrope-latin-variable.woff2' \
            ! -name 'mohammed-portrait.webp' \
            ! -name 'mohammed-social-preview.png' \
            -delete

          cp -a /tmp/portfolio-release/. .
          rm -rf .deploy .github

      - name: Validate release tree
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f assets/mohammed-social-preview.png
          ! test -e navigation-v1.6.9.css
          ! grep -R "Version 1.6.9\|The future takes shape one step at a time" --exclude-dir=.git .
          grep -q "Version 2.0" index.html
          node --check script.js

      - name: Publish clean release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish audited portfolio v2.0"
          git push origin HEAD:main
