name: Refresh Pages after Journey badge polish

on:
  push:
    paths:
      - '.github/workflows/refresh-pages-after-journey-badges.yml'

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove refresh workflow and push clean HEAD
        run: |
          rm -f .github/workflows/refresh-pages-after-journey-badges.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Pages after Journey badge polish"
          git push origin main
      - name: Request Pages build for clean HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
