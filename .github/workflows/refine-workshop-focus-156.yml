name: Refine Workshop focus and mobile About

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-workshop-focus-156.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Workshop focus refinement
        run: python tools/refine-workshop-focus-156.py

      - name: Commit clean final state
        run: |
          rm -f tools/refine-workshop-focus-156.py
          rm -f .github/workflows/refine-workshop-focus-156.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine Workshop focus and mobile About"
          git push origin main
