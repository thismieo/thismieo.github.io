name: Apply regression repair 4.5.18 v3

on:
  push:
    branches: [fix/regression-audit-4518-v3]

permissions:
  contents: write
  pages: write

jobs:
  audit-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regression-audit-4518-v3
          fetch-depth: 0

      - name: Repair, deeply audit, and publish clean production commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: 0680ffb25e9553d38013c23c5a885e5686d24070
        run: |
          set -euo pipefail
          cp .github/scripts/apply_regression_4518.py /tmp/apply_regression_4518.py
          cp .github/scripts/audit_regression_4518.mjs /tmp/audit_regression_4518.mjs

          # Stabilize the test harness: verify the real Workshop CTA once, then reveal
          # the Workshop directly for rendering audits so transition state cannot skew them.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/audit_regression_4518.mjs')
          s=p.read_text(encoding='utf-8')

          old_open='''async function openWorkshop(cdp) {\n  await cdp.eval(`(() => { const b=document.querySelector('[data-open-workshop]'); if(!b) throw new Error('open workshop button missing'); b.click(); return true; })()`);\n  await sleep(1350);\n  const state = await cdp.eval(`({open:document.body.classList.contains('workshop-open'),hidden:document.querySelector('[data-workshop-panel]')?.hidden})`);\n  assert(state.open && state.hidden === false, 'Workshop did not open for audit');\n}\n'''
          new_open='''async function openWorkshop(cdp) {\n  const state = await cdp.eval(`(() => {\n    const panel=document.querySelector('[data-workshop-panel]');\n    const portfolio=document.querySelector('[data-portfolio-panel]');\n    if(!panel) return {missing:true};\n    panel.hidden=false;\n    if(portfolio) portfolio.hidden=true;\n    document.body.classList.add('workshop-open');\n    return {missing:false,open:document.body.classList.contains('workshop-open'),hidden:panel.hidden};\n  })()`);\n  assert(!state.missing && state.open && state.hidden === false, 'Workshop could not be revealed for rendering audit');\n  await sleep(80);\n}\n'''
          if s.count(old_open)!=1: raise SystemExit('openWorkshop harness replacement point not unique')
          s=s.replace(old_open,new_open)

          old_nested="''"  # sentinel only to keep quoting straightforward below
          target="  assert(gateway.cardActive && gateway.duration==='0.52s', `${label}: Workshop CTA not routed to canonical card sheen`);\n  await sleep(1200);\n"
          repl="  assert(gateway.cardActive && gateway.duration==='0.52s', `${label}: Workshop CTA not routed to canonical card sheen`);\n  await sleep(1200);\n  const opened = await cdp.eval(`({open:document.body.classList.contains('workshop-open'),hidden:document.querySelector('[data-workshop-panel]')?.hidden})`);\n  assert(opened.open && opened.hidden === false, `${label}: Workshop CTA did not actually open Workshop`);\n"
          if s.count(target)!=1: raise SystemExit('CTA functional assertion insertion point not unique')
          s=s.replace(target,repl)

          tail="  console.log(label, 'Nested card routing:', JSON.stringify({gateway,contact}));\n}"
          tail_repl="  console.log(label, 'Nested card routing:', JSON.stringify({gateway,contact,opened}));\n  await cdp.send('Page.navigate', { url: site + '?audit=post-targets-' + Date.now() });\n  await ready(cdp);\n}"
          if s.count(tail)!=1: raise SystemExit('home reset insertion point not unique')
          s=s.replace(tail,tail_repl)

          p.write_text(s,encoding='utf-8')
          PY

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASELINE"
          git checkout -B regression-work "$BASELINE"
          python3 /tmp/apply_regression_4518.py

          node --check script.js
          node --check workshop-integrated.js
          node --check interactions.js
          git diff --check

          # Structural ownership checks.
          ! grep -q 'workshop-grid-foundation > .knowledge-card:nth-child(' workshop-integrated.css
          grep -q 'workshop-grid-foundation > .knowledge-card:nth-of-type(3)' workshop-integrated.css
          grep -q 'workshop-grid-foundation > .knowledge-card:nth-of-type(4)' workshop-integrated.css
          ! grep -q 'workshop-grid-foundation > .knowledge-card:not(:last-child)::after' visual-system.css
          grep -A6 '.portfolio-panel .project-mobile-separator > span {' visual-system.css | grep -q 'height: 1px !important;'
          grep -A6 '.portfolio-panel .project-mobile-separator > span {' visual-system.css | grep -q 'display: block !important;'
          grep -q 'const workshopEntryAction = target.closest(".workshop-entry-action")' interactions.js
          grep -q '".practice-selector-card", ".knowledge-card"' interactions.js

          # Syntax / structure sanity.
          python3 - <<'PY'
          from pathlib import Path
          for name in ['styles.css','contact-linkedin.css','workshop-integrated.css','visual-system.css','interactions.css']:
              text=Path(name).read_text(encoding='utf-8'); depth=0; quote=None; esc=False; comment=False; i=0
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if comment:
                      if c=='*' and n=='/': comment=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                      i+=1; continue
                  if c=='/' and n=='*': comment=True; i+=2; continue
                  if c in "'\"": quote=c; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}': depth-=1
                  if depth<0: raise SystemExit(f'{name}: brace underflow')
                  i+=1
              if depth: raise SystemExit(f'{name}: brace depth {depth}')
          print('CSS brace audit: OK')
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('Duplicate IDs: '+', '.join(dup))
          print('HTML duplicate-ID audit: OK')
          PY

          # Browser audit: Desktop, modern iPhone path, and iPhone X / iOS 16 fallback.
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/4518-http.log 2>&1 &
          HTTP_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/chrome-4518-v3 about:blank >/tmp/4518-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $HTTP_PID 2>/dev/null || true' EXIT
          node /tmp/audit_regression_4518.mjs
          kill $CHROME_PID $HTTP_PID 2>/dev/null || true
          trap - EXIT

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 404.html CHANGELOG.md index.html interactions.js visual-system.css workshop-integrated.css | sort)"
          test "$changed" = "$expected"

          # No audit machinery in production.
          rm -rf .github
          git add -A
          test -z "$(git status --porcelain | grep -E '(^|/)(\.github|regression_4518|regression-audit)' || true)"
          tree="$(git write-tree)"
          test -z "$(git ls-tree -r --name-only "$tree" | grep -E '(^|/)(\.github|\.run-|temp|payload)' || true)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit="$(printf '%s\n' 'Repair visual regressions and interaction timing' | git commit-tree "$tree" -p "$BASELINE")"
          git push origin "${commit}:refs/heads/main" --force-with-lease="refs/heads/main:${BASELINE}"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

          echo "FINAL_COMMIT=$commit"
