name: Restore project cards

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-project-card-radius.yml'

permissions:
  contents: write

jobs:
  fix-project-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore corners and remove phone separators
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('styles.css'); s=p.read_text(encoding='utf-8'); old='.project-grid > .project-card {\n  min-height: 342px;\n  grid-column: span 4;\n  padding: 23px 21px 21px;\n}'; new='.project-grid > .project-card {\n  min-height: 342px;\n  grid-column: span 4;\n  padding: 23px 21px 21px;\n  border-radius: 19px;\n}'; assert old in s; guard='\n\n/* Mobile project separator safeguard — August 2026 */\n@media (max-width: 900px) {\n  .project-separator,\n  .project-grid::before,\n  .project-grid::after {\n    content: none !important;\n    display: none !important;\n    background: none !important;\n    box-shadow: none !important;\n  }\n}\n'; s=s.replace(old,new,1); s=s.replace(guard,''); p.write_text(s+guard, encoding='utf-8')"
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('styles.css?v=4.3.5','styles.css?v=4.3.6').replace('Version 4.3.5','Version 4.3.6'); assert 'styles.css?v=4.3.6' in s and 'Version 4.3.6' in s; p.write_text(s, encoding='utf-8')"
          grep -q 'border-radius: 19px' styles.css
          grep -q '@media (max-width: 900px)' styles.css
          grep -q 'styles.css?v=4.3.6' index.html

          rm .github/workflows/restore-project-card-radius.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css index.html .github
          git commit -m 'Restore project card corners and hide phone separators'
          git push
