name: One-time layout consistency audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-layout-audit.yml"

permissions:
  contents: write

jobs:
  refine-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout refinements
        run: |
          set +e
          python3 .github/scripts/layout_refine.py > refinement.log 2>&1
          echo "refinement_status=$?" >> refinement.log
          exit 0

      - name: Install visual audit tooling
        run: |
          set +e
          python3 -m pip install --quiet playwright > install.log 2>&1
          python3 -m playwright install chromium >> install.log 2>&1
          echo "install_status=$?" >> install.log
          exit 0

      - name: Run responsive layout audit
        run: |
          set +e
          python3 .github/scripts/layout_audit.py > audit.log 2>&1
          echo "audit_status=$?" >> audit.log
          exit 0

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: layout-consistency-audit
          path: |
            layout-audit
            refinement.log
            audit.log
            install.log
          if-no-files-found: ignore

      - name: Commit refinements and remove temporary files
        run: |
          set +e
          rm -rf layout-audit
          rm -f refinement.log audit.log install.log
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align hero label, journey states and workshop spacing" || true
          git push || true
          exit 0
