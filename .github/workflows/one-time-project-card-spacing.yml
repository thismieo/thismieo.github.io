name: One-time project card spacing refinement

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-project-card-spacing.yml"

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine project card spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("index.html")
          css_path = Path("styles.css")
          html = html_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return updated

          css = replace_once(
              css,
              "/* Blue Continuum 4.2.3 — Consolidated portfolio stylesheet */",
              "/* Blue Continuum 4.2.4 — Consolidated portfolio stylesheet */",
              "stylesheet version",
          )

          css = replace_once(
              css,
              """.project-card {
            min-height: 246px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            border-radius: 21px;
          }

          .project-featured {
            --accent-rgb: var(--palette-teal);
            min-height: 508px;
            padding: 28px;
          }""",
              """.project-card {
            min-height: 264px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            border-radius: 21px;
          }

          .project-featured {
            --accent-rgb: var(--palette-teal);
            min-height: 546px;
            padding: 28px;
          }

          .project-featured > div:nth-child(2) {
            margin-top: auto;
          }""",
              "desktop project card spacing",
          )

          css = regex_once(
              css,
              r"(@media \(max-width: 1050px\) \{.*?\.project-featured \{.*?min-height:\s*)430px;",
              r"\g<1>452px;",
              "tablet featured project height",
          )

          css = regex_once(
              css,
              r"(@media \(max-width: 700px\) \{.*?\.project-featured \{\s*min-height:\s*)390px;",
              r"\g<1>412px;",
              "mobile featured project height",
          )

          css = regex_once(
              css,
              r"(@media \(max-width: 700px\) \{.*?\.project-featured \{.*?\.project-card \{\s*min-height:\s*)230px;",
              r"\g<1>246px;",
              "mobile project card height",
          )

          html = replace_once(
              html,
              'href="styles.css?v=4.2.3"',
              'href="styles.css?v=4.2.4"',
              "stylesheet cache version",
          )
          html = replace_once(
              html,
              '<p class="footer-version">Version 4.2.3</p>',
              '<p class="footer-version">Version 4.2.4</p>',
              "footer version",
          )

          if css.count("{") != css.count("}"):
              raise SystemExit("CSS braces are unbalanced")
          if html.count("<section") != html.count("</section>"):
              raise SystemExit("HTML section tags are unbalanced")
          if ".project-featured > div:nth-child(2)" not in css:
              raise SystemExit("featured project spacing rule missing")
          if "min-height: 264px;" not in css or "min-height: 546px;" not in css:
              raise SystemExit("desktop project height audit failed")

          css_path.write_text(css, encoding="utf-8")
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Install visual QA tooling
        continue-on-error: true
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

      - name: Run responsive visual QA
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import time
          from playwright.sync_api import sync_playwright

          output = Path("qa-output")
          output.mkdir(exist_ok=True)
          results = {}
          server = subprocess.Popen(
              ["python3", "-m", "http.server", "4173", "--bind", "127.0.0.1"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          time.sleep(1.2)

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  for name, width, height in (
                      ("desktop", 1440, 1000),
                      ("mobile", 390, 844),
                  ):
                      page = browser.new_page(viewport={"width": width, "height": height})
                      page.goto("http://127.0.0.1:4173", wait_until="networkidle")
                      page.evaluate("document.fonts.ready")
                      page.evaluate("document.activeElement && document.activeElement.blur()")

                      home = page.evaluate("""
                      () => {
                        const style = (selector) => getComputedStyle(document.querySelector(selector));
                        const hero = style('.hero-copy > .eyebrow');
                        const section = style('#about .eyebrow');
                        const timeline = style('.timeline-state');
                        const heroBox = document.querySelector('.hero-copy > .eyebrow').getBoundingClientRect();
                        const titleBox = document.querySelector('.hero h1').getBoundingClientRect();
                        const featured = document.querySelector('.project-featured');
                        const featuredMeta = featured.querySelector('.project-meta').getBoundingClientRect();
                        const featuredField = featured.querySelector('.project-field').getBoundingClientRect();
                        const standard = document.querySelector('.project-stack .project-card');
                        const standardMeta = standard.querySelector('.project-meta').getBoundingClientRect();
                        const standardField = standard.querySelector('.project-field').getBoundingClientRect();
                        return {
                          overflow: document.documentElement.scrollWidth - window.innerWidth,
                          heroText: document.querySelector('.hero-copy > .eyebrow').textContent.trim(),
                          heroTransform: hero.textTransform,
                          sectionTransform: section.textTransform,
                          timelineTransform: timeline.textTransform,
                          heroGap: titleBox.top - heroBox.bottom,
                          featuredHeight: featured.getBoundingClientRect().height,
                          featuredMetaGap: featuredField.top - featuredMeta.bottom,
                          standardHeight: standard.getBoundingClientRect().height,
                          standardMetaGap: standardField.top - standardMeta.bottom,
                        };
                      }
                      """)

                      page.locator(".hero").screenshot(path=output / f"{name}-hero.png")
                      page.locator("#about").screenshot(path=output / f"{name}-about.png")
                      page.locator("#journey").screenshot(path=output / f"{name}-journey.png")
                      page.locator("#projects").screenshot(path=output / f"{name}-projects.png")

                      page.locator("[data-open-workshop]").click()
                      page.wait_for_function("document.body.classList.contains('workshop-open')")
                      page.wait_for_timeout(500)
                      workshop = page.evaluate("""
                      () => {
                        const state = getComputedStyle(document.querySelector('.workshop-state'));
                        const box = document.querySelector('.workshop-state').getBoundingClientRect();
                        return {
                          transform: state.textTransform,
                          fontSize: state.fontSize,
                          fontWeight: state.fontWeight,
                          letterSpacing: state.letterSpacing,
                          visibleWidth: box.width,
                          visibleHeight: box.height,
                        };
                      }
                      """)
                      page.locator('[aria-labelledby="current-title"]').scroll_into_view_if_needed()
                      page.wait_for_timeout(200)
                      page.locator('[aria-labelledby="current-title"]').screenshot(
                          path=output / f"{name}-workshop-current.png"
                      )
                      results[name] = {"home": home, "workshop": workshop}
                      page.close()
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)

          (output / "metrics.json").write_text(
              json.dumps(results, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-spacing-and-typography-qa
          path: qa-output
          if-no-files-found: warn

      - name: Commit refinement and remove temporary files
        run: |
          rm -rf qa-output
          rm -f .github/workflows/one-time-project-card-spacing.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve project card spacing and label hierarchy"
          git push
