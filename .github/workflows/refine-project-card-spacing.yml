name: Refine project card spacing

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-project-card-spacing.yml'

permissions:
  contents: write

jobs:
  refine-project-spacing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply project width refinement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('styles.css')
          index_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          marker = '/* Project card width refinement — August 2026 */'
          if marker in css:
              raise SystemExit('Project width refinement already exists')

          addition = (
              '\n\n/* Project card width refinement — August 2026 */\n'
              '@media (min-width: 1051px) {\n'
              '  .project-grid {\n'
              '    width: min(100%, 1120px);\n'
              '    margin-inline: auto;\n'
              '    column-gap: 32px;\n'
              '    row-gap: 26px;\n'
              '    background-size: 1px calc((100% - 26px) / 2);\n'
              '  }\n'
              '  .project-grid::before { left: calc(33.333333% - 5.333px); }\n'
              '  .project-grid::after { left: calc(66.666667% + 5.333px); }\n'
              '  .project-grid::before,\n'
              '  .project-grid::after { height: calc((100% - 26px) / 2); }\n'
              '}\n'
              '@media (max-width: 1050px) and (min-width: 701px) {\n'
              '  .project-grid {\n'
              '    width: min(100%, 880px);\n'
              '    margin-inline: auto;\n'
              '    column-gap: 24px;\n'
              '    row-gap: 18px;\n'
              '  }\n'
              '  .project-grid > .project-card:last-child { width: calc(50% - 12px); }\n'
              '  .project-grid::before,\n'
              '  .project-grid::after { height: calc((100% - 36px) / 3); }\n'
              '  .project-grid::after { top: calc((100% - 36px) / 3 + 18px); }\n'
              '}\n'
          )

          css += addition
          index = index.replace('styles.css?v=4.3.3', 'styles.css?v=4.3.4')
          index = index.replace('Version 4.3.3', 'Version 4.3.4')

          if 'styles.css?v=4.3.4' not in index or 'Version 4.3.4' not in index:
              raise SystemExit('Version bump failed')

          css_path.write_text(css, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          PY

          rm .github/workflows/refine-project-card-spacing.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css index.html .github
          git commit -m 'Refine project card width and spacing'
          git push
