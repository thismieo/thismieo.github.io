name: Restore Workshop section rhythm

on:
  push:
    paths:
      - '.github/workflows/restore-workshop-section-rhythm-157.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore Workshop section rhythm
        run: python tools/restore-workshop-section-rhythm-157.py
      - name: Commit clean final state
        run: |
          rm -f tools/restore-workshop-section-rhythm-157.py
          rm -f .github/workflows/restore-workshop-section-rhythm-157.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Workshop section spacing rhythm"
          git push origin main
