name: Apply Workshop icon palette

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Workshop icon colors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('workshop-integrated.css')
          html_path = Path('index.html')
          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          marker = '\n/* ---------- Hover capability ---------- */'
          layer = r'''

/* ---------- 6.0.13 coordinated icon palette ---------- */
/* Icon geometry stays unchanged; only chromatic hierarchy is refreshed. */
.workshop-grid-foundation > .knowledge-card:nth-of-type(1) { --main-icon-rgb: 139, 203, 188; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(1) .knowledge-card-topics li:nth-child(1) { --topic-icon-rgb: 108, 185, 190; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(1) .knowledge-card-topics li:nth-child(2) { --topic-icon-rgb: 111, 158, 192; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(1) .knowledge-card-topics li:nth-child(3) { --topic-icon-rgb: 177, 133, 155; }

.workshop-grid-foundation > .knowledge-card:nth-of-type(2) { --main-icon-rgb: 139, 176, 209; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(2) .knowledge-card-topics li:nth-child(1) { --topic-icon-rgb: 121, 170, 202; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(2) .knowledge-card-topics li:nth-child(2) { --topic-icon-rgb: 128, 177, 159; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(2) .knowledge-card-topics li:nth-child(3) { --topic-icon-rgb: 186, 151, 109; }

.workshop-grid-foundation > .knowledge-card:nth-of-type(3) { --main-icon-rgb: 180, 164, 215; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(3) .knowledge-card-topics li:nth-child(1) { --topic-icon-rgb: 165, 149, 205; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(3) .knowledge-card-topics li:nth-child(2) { --topic-icon-rgb: 120, 156, 195; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(3) .knowledge-card-topics li:nth-child(3) { --topic-icon-rgb: 188, 151, 111; }

.workshop-grid-foundation > .knowledge-card:nth-of-type(4) { --main-icon-rgb: 211, 172, 128; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(4) .knowledge-card-topics li:nth-child(1) { --topic-icon-rgb: 199, 155, 112; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(4) .knowledge-card-topics li:nth-child(2) { --topic-icon-rgb: 160, 146, 196; }
.workshop-grid-foundation > .knowledge-card:nth-of-type(4) .knowledge-card-topics li:nth-child(3) { --topic-icon-rgb: 184, 132, 145; }

.workshop-grid-featured > .knowledge-card:nth-of-type(1) { --main-icon-rgb: 210, 147, 176; }
.workshop-grid-featured > .knowledge-card:nth-of-type(1) .knowledge-card-topics li:nth-child(1) { --topic-icon-rgb: 194, 132, 160; }
.workshop-grid-featured > .knowledge-card:nth-of-type(1) .knowledge-card-topics li:nth-child(2) { --topic-icon-rgb: 160, 145, 200; }
.workshop-grid-featured > .knowledge-card:nth-of-type(1) .knowledge-card-topics li:nth-child(3) { --topic-icon-rgb: 189, 151, 112; }

.workshop-grid-featured > .knowledge-card:nth-of-type(2) { --main-icon-rgb: 115, 191, 197; }
.workshop-grid-featured > .knowledge-card:nth-of-type(2) .knowledge-card-topics li:nth-child(1) { --topic-icon-rgb: 104, 180, 184; }
.workshop-grid-featured > .knowledge-card:nth-of-type(2) .knowledge-card-topics li:nth-child(2) { --topic-icon-rgb: 118, 164, 198; }
.workshop-grid-featured > .knowledge-card:nth-of-type(2) .knowledge-card-topics li:nth-child(3) { --topic-icon-rgb: 133, 176, 160; }

.workshop-grid-featured > .knowledge-card:nth-of-type(3) { --main-icon-rgb: 216, 185, 134; }
.workshop-grid-featured > .knowledge-card:nth-of-type(3) .knowledge-card-topics li:nth-child(1) { --topic-icon-rgb: 199, 169, 117; }
.workshop-grid-featured > .knowledge-card:nth-of-type(3) .knowledge-card-topics li:nth-child(2) { --topic-icon-rgb: 140, 178, 145; }
.workshop-grid-featured > .knowledge-card:nth-of-type(3) .knowledge-card-topics li:nth-child(3) { --topic-icon-rgb: 181, 133, 151; }
'''

          if '/* ---------- 6.0.13 coordinated icon palette ---------- */' in css:
              raise SystemExit('Icon palette already applied.')
          if marker not in css:
              raise SystemExit('Hover marker not found; no change made.')
          if '/* Workshop 6.0.12 — consolidated production stylesheet.' not in css:
              raise SystemExit('Expected CSS version not found.')
          if 'workshop-integrated.css?v=6.0.12' not in html:
              raise SystemExit('Expected HTML cache version not found.')

          css = css.replace(marker, layer + marker, 1)
          css = css.replace('/* Workshop 6.0.12 — consolidated production stylesheet.', '/* Workshop 6.0.13 — consolidated production stylesheet.', 1)
          html = html.replace('workshop-integrated.css?v=6.0.12', 'workshop-integrated.css?v=6.0.13', 1)

          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit final state
        shell: bash
        run: |
          rm .github/workflows/apply-workshop-icon-palette.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop-integrated.css index.html .github/workflows/apply-workshop-icon-palette.yml
          git diff --cached --quiet && exit 0
          git commit -m "Coordinate Workshop icon palette"
          git push origin HEAD:main
