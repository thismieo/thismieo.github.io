name: Apply Workshop icon palette

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply icon palette
        run: python .github/scripts/apply-workshop-icon-palette.py

      - name: Commit final state
        run: |
          rm .github/scripts/apply-workshop-icon-palette.py
          rm .github/workflows/apply-workshop-icon-palette.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop-integrated.css index.html .github/scripts/apply-workshop-icon-palette.py .github/workflows/apply-workshop-icon-palette.yml
          git diff --cached --quiet && exit 0
          git commit -m "Coordinate Workshop icon palette"
          git push origin HEAD:main
