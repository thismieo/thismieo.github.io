name: Repair email copy icons

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair icons and remove temporary workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<svg class="copy-icon" viewBox="0 0 24 24"><rect x="8" y="8" width="10" height="10" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>'
          new = '<svg class="copy-icon" viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10"/></svg>'

          if text.count(old) != 2:
              raise SystemExit(f'Expected exactly two old icons, found {text.count(old)}')
          text = text.replace(old, new)
          if text.count(new) != 2 or old in text:
              raise SystemExit('Icon validation failed')

          index.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-copy-icon.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-copy-icon-run.yml').unlink(missing_ok=True)
          PY

          git diff --check
          grep -q 'rect x="4" y="8" width="12" height="12"' index.html
          ! grep -q 'M6 15H5a2 2 0 0 1-2-2V5' index.html

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair email copy icons'
          git push
