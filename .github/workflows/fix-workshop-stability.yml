name: Fix Workshop interaction stability

on:
  push:
    branches: [main]
    paths:
      - .workshop-stability-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verify and clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.workshop-stability-patch.py')
          source = path.read_text(encoding='utf-8')
          marker = '# Guard checks before write.'
          insertion = '''# Final cleanup for the global resize listener: measure only the active slide.\njs = js.replace('refreshCarouselMetrics(name, true);', 'measureActiveCarousel(name, true);')\n\n'''
          if marker not in source:
              raise SystemExit('Patch guard marker missing')
          source = source.replace(marker, insertion + marker, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python3 .workshop-stability-patch.py
          node --check workshop-integrated.js
          grep -q 'const measureActiveCarousel' workshop-integrated.js
          grep -q 'const goToCarousel' workshop-integrated.js
          grep -q 'desiredTop = window.innerWidth <= 700 ? 18 : 28' workshop-integrated.js
          ! grep -q 'animateCarouselTo' workshop-integrated.js
          ! grep -q 'refreshCarouselMetrics' workshop-integrated.js
          ! grep -q 'gentlySettleClosedCard' workshop-integrated.js
          ! grep -q 'motionFrame' workshop-integrated.js
          ! grep -q 'programmatic' workshop-integrated.js
          grep -q 'scroll-snap-type: x mandatory' workshop-integrated.css
          ! grep -q 'scroll-snap-stop: always' workshop-integrated.css
          grep -q 'workshop-integrated.css?v=5.4.0' index.html
          grep -q 'workshop-integrated.js?v=5.4.0' index.html
          rm -rf .github .workshop-stability-patch.py .workshop-stability-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stabilize Workshop open close and native carousel'
          git push origin HEAD:main
