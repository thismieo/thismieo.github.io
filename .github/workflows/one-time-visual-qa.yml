name: One-time responsive visual QA

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install browser tooling
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Capture responsive sections
        run: |
          python3 -m http.server 8000 >/tmp/site-server.log 2>&1 &
          printf '%s' '' | base64 --decode > /tmp/visual_qa.py
          python3 /tmp/visual_qa.py

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visual-qa
          path: qa-shots/*.png
          if-no-files-found: error

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/one-time-visual-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary visual QA workflow"
          git push origin HEAD:main
