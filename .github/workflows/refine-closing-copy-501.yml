name: Refine closing copy 5.0.1
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-closing-copy-501.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply closing copy readability patch
        run: python .github/scripts/refine-closing-copy-501.py
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check workshop-integrated.js
      - name: Commit clean final state
        run: |
          rm -f .github/scripts/refine-closing-copy-501.py .github/workflows/refine-closing-copy-501.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Improve closing message readability"
            git push
          fi
