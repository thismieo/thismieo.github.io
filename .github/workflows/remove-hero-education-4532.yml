name: Remove Hero education detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-hero-education-4532.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicated Hero education detail
        run: python .github/scripts/remove-hero-education-4532.py
      - name: Commit clean final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Simplify Hero education hierarchy"
          git push
