name: Apply Workshop entry typography

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Workshop entry typography update
        run: python tools/apply-workshop-entry-type-4530.py

      - name: Commit final state
        run: |
          rm tools/apply-workshop-entry-type-4530.py
          rm .github/workflows/apply-workshop-entry-type-4530.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html tools/apply-workshop-entry-type-4530.py .github/workflows/apply-workshop-entry-type-4530.yml
          git diff --cached --quiet && exit 0
          git commit -m "Increase Workshop entry CTA typography"
          git push origin HEAD:main
