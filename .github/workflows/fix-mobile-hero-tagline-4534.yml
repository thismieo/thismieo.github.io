name: Fix mobile Hero tagline

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix-mobile-hero-tagline-4534.py'
      - '.github/workflows/fix-mobile-hero-tagline-4534.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix mobile Hero tagline layout
        run: python tools/fix-mobile-hero-tagline-4534.py
      - name: Commit clean final state
        run: |
          rm tools/fix-mobile-hero-tagline-4534.py
          rm .github/workflows/fix-mobile-hero-tagline-4534.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore mobile Hero tagline rhythm"
          git push
