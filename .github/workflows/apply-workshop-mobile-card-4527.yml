name: Apply mobile Workshop card polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile Workshop card update
        run: python tools/apply_workshop_mobile_card_4527.py

      - name: Commit final state
        run: |
          rm tools/apply_workshop_mobile_card_4527.py
          rm .github/workflows/apply-workshop-mobile-card-4527.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css tools/apply_workshop_mobile_card_4527.py .github/workflows/apply-workshop-mobile-card-4527.yml
          git diff --cached --quiet && exit 0
          git commit -m "Polish mobile Workshop entry card"
          git push origin HEAD:main
