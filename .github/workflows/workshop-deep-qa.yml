name: Workshop deep browser QA

on:
  push:
    branches: [main]
    paths:
      - .workshop-deep-qa-trigger

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply production candidate and static guards
        run: |
          set -eu
          python3 .workshop-deep-fix.py
          python3 .workshop-scroll-fix.py
          python3 .workshop-direct-prime.py
          python3 .workshop-final-qa-adjust.py
          node --check script.js
          node --check workshop-integrated.js
          node --check .workshop-deep-qa.mjs
          node --check .workshop-archive-first-qa.mjs
          node --check .workshop-webkit-scroll-diagnostic.mjs
          grep -q 'flex: 0 0 100% !important' workshop-integrated.css
          ! grep -q 'content-visibility: auto' workshop-integrated.css
          grep -q 'let workshopScrollFrame = 0' workshop-integrated.js
          grep -q 'let workshopAlignTimer = 0' workshop-integrated.js
          grep -q 'let workshopAlignRequest = 0' workshop-integrated.js
          grep -q 'const cancelWorkshopMotion' workshop-integrated.js
          grep -q 'const rangeReady' workshop-integrated.js
          grep -q 'document.documentElement.scrollHeight - window.innerHeight' workshop-integrated.js
          ! grep -q -- '--practice-slot-height' workshop-integrated.js
          ! grep -q -- '--practice-slot-height' workshop-integrated.css
          ! grep -q 'commitOpenSlotHeight' workshop-integrated.js
          ! grep -q 'retryClampedOpenAlignment' workshop-integrated.js
          ! grep -q 'workshopScrollGeneration' workshop-integrated.js
          grep -q 'has-practice-open' workshop-integrated.js
          grep -q 'has-practice-open .workshop-main' workshop-integrated.css
          grep -q 'const copyTimers = new WeakMap' workshop-integrated.js
          grep -q 'document.createDocumentFragment' workshop-integrated.js
          grep -q 'interacting: false' workshop-integrated.js
          ! grep -q 'let copyTimer' workshop-integrated.js
          ! grep -q 'scrollRestoration = "manual"' script.js
          grep -q 'script.js?v=4.2.0' index.html
          grep -q 'workshop-integrated.css?v=5.6.0' index.html
          grep -q 'workshop-integrated.js?v=5.6.0' index.html
      - name: Install Playwright package
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/workshop-http.log 2>&1 &
          echo $! > /tmp/workshop-http.pid
          sleep 1
      - name: Repeat WebKit direct-load alignment five times
        run: node .workshop-webkit-scroll-diagnostic.mjs
      - name: Run primary cross-device browser QA
        run: node .workshop-deep-qa.mjs
      - name: Run fresh Archive-first touch QA
        run: node .workshop-archive-first-qa.mjs
      - name: Publish verified Workshop fix and clean temporary QA files
        run: |
          set -eu
          ROOT="$GITHUB_WORKSPACE"
          git -C "$ROOT" config user.name 'github-actions[bot]'
          git -C "$ROOT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$ROOT" rm -r --ignore-unmatch .github .workshop-deep-qa.mjs .workshop-archive-first-qa.mjs .workshop-webkit-scroll-diagnostic.mjs .workshop-deep-fix.py .workshop-scroll-fix.py .workshop-final-qa-adjust.py .workshop-direct-prime.py .workshop-qa-adjust.py .workshop-deep-qa-trigger
          rm -rf "$ROOT/node_modules" "$ROOT/package.json" "$ROOT/package-lock.json"
          git -C "$ROOT" add -A
          git -C "$ROOT" status --short
          git -C "$ROOT" commit -m 'Stabilize Workshop carousel and mobile interaction'
          git -C "$ROOT" push origin HEAD:main
      - name: Server log on failure
        if: failure()
        run: cat /tmp/workshop-http.log || true
