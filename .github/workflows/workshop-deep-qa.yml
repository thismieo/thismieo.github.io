name: Workshop production finalize

on:
  push:
    branches: [main]
    paths:
      - .workshop-deep-qa-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate new Workshop architecture
        shell: bash
        run: |
          set -euo pipefail
          node --check workshop-integrated.js
          grep -q 'className = "practice-selector-card"' workshop-integrated.js
          grep -q 'const selectorState = Object.create(null)' workshop-integrated.js
          grep -q 'const BRACKETS = new Set' workshop-integrated.js
          grep -q 'tok-bracket' workshop-integrated.js
          grep -q '.practice-selector-card' workshop-integrated.css
          grep -q '.practice-code .tok-bracket' workshop-integrated.css
          grep -q '.practice-explorer-slot\[hidden\]' workshop-integrated.css
          ! grep -q 'carouselState' workshop-integrated.js
          ! grep -q 'practice-carousel-viewport' workshop-integrated.js
          ! grep -q 'measureActiveCarousel' workshop-integrated.js
          ! grep -q 'gentlyAlignOpenContent' workshop-integrated.js
          ! grep -q 'smoothScrollTo' workshop-integrated.js
          python3 - <<'PY'
          from pathlib import Path
          css = Path('workshop-integrated.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')
          js = Path('workshop-integrated.js').read_text(encoding='utf-8')
          required = [
              'Prime Number Analyzer', 'Triangle Analyzer', 'Student Grade Analyzer',
              'Smart Discount Calculator', 'BMI Analyzer', 'Even or Odd',
              'Age Classification', 'Positive Number Validator', 'Time Converter',
              'Arithmetic Calculator', 'Eligibility Logic', 'Name & Age'
          ]
          missing = [title for title in required if title not in js]
          if missing:
              raise SystemExit(f'Missing practice content: {missing}')
          PY

      - name: Finalize cache version and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('workshop-integrated.css?v=5.5.0', 'workshop-integrated.css?v=5.7.0')
          html = html.replace('workshop-integrated.css?v=5.6.0', 'workshop-integrated.css?v=5.7.0')
          html = html.replace('workshop-integrated.js?v=5.5.0', 'workshop-integrated.js?v=5.7.0')
          html = html.replace('workshop-integrated.js?v=5.6.0', 'workshop-integrated.js?v=5.7.0')
          if 'workshop-integrated.css?v=5.7.0' not in html or 'workshop-integrated.js?v=5.7.0' not in html:
              raise SystemExit('Workshop cache version update failed')
          path.write_text(html, encoding='utf-8')
          PY

          rm -rf .github
          rm -f .workshop-archive-first-qa.mjs \
                .workshop-deep-fix.py \
                .workshop-deep-qa-trigger \
                .workshop-deep-qa.mjs \
                .workshop-direct-prime.py \
                .workshop-final-qa-adjust.py \
                .workshop-qa-adjust.py \
                .workshop-scroll-fix.py \
                .workshop-webkit-scroll-diagnostic.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize lightweight Workshop practice experience'
          git push origin HEAD:main
