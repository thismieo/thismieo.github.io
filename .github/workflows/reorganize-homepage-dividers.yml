name: Reorganize homepage dividers

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: reorganize-homepage-dividers
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded redesign
        run: python3 .github/reorganize_homepage_dividers.py

      - name: Verify exact result
        run: |
          git diff --check
          test ! -e .github/workflows/reorganize-homepage-dividers.yml
          test ! -e .github/reorganize_homepage_dividers.py
          test ! -e .divider-reorg-trigger
          test "$(grep -o 'class="timeline-divider ' index.html | wc -l)" -eq 4
          test "$(grep -o 'class="workshop-entry-shimmer"' index.html | wc -l)" -eq 1
          ! grep -q ':is(#journey, #projects, #contact, #closing)::before' styles.css
          ! grep -q '\.timeline::after' styles.css
          grep -q '\.workshop-entry-shimmer' styles.css
          grep -q '\.timeline-divider-line' styles.css

      - name: Commit focused redesign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reorganize homepage dividers around cards'
          git push
