name: Refine responsive copy
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-responsive-copy-1512.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine responsive copy
        run: python .github/scripts/refine-responsive-copy-1512.py
      - name: Commit clean final state
        run: |
          rm -f .github/scripts/refine-responsive-copy-1512.py .github/workflows/refine-responsive-copy-1512.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refine mobile contact and closing copy rhythm"
            git push
          fi
