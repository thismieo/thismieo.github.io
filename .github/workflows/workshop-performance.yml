name: Workshop performance verification

on:
  push:
    branches: [main]
    paths:
      - .workshop-perf-trigger

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply performance patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 .workshop-perf-patch.py
          node --check workshop-integrated.js

          grep -q 'const scheduleIdle' workshop-integrated.js
          grep -q 'const hydrateSlide' workshop-integrated.js
          grep -q 'const carouselTargetLeft' workshop-integrated.js
          grep -q 'const nearestCarouselIndex' workshop-integrated.js
          grep -q '"onscrollend" in viewport' workshop-integrated.js
          grep -q 'scroll-snap-align: center' workshop-integrated.css
          grep -q 'content-visibility: auto' workshop-integrated.css
          grep -q 'flex: 0 0 calc(100% - 36px)' workshop-integrated.css
          grep -q 'workshop-integrated.css?v=5.5.0' index.html
          grep -q 'workshop-integrated.js?v=5.5.0' index.html

          ! grep -q 'syncCarouselFromScroll' workshop-integrated.js
          ! grep -q 'interactionMotion' workshop-integrated.js
          ! grep -q 'scrollFrame' workshop-integrated.js
          ! grep -q 'is-sizing-instant' workshop-integrated.js
          ! grep -q 'transition: height' workshop-integrated.css

          rm -rf .github .workshop-perf-patch.py .workshop-perf-trigger

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Optimize Workshop interaction for consistent device performance'
          git push origin HEAD:main
