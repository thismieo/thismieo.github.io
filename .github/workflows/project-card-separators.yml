name: Add project card separators

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-card-separators.yml'

permissions:
  contents: write

jobs:
  update-project-separators:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Apply and publish separators
        env:
          PATCH_SCRIPT: ''
        run: echo "$PATCH_SCRIPT" | base64 --decode | python3
