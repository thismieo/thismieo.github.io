name: Refine mobile About copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-mobile-about-copy-158.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine mobile About copy
        run: python tools/refine-mobile-about-copy-158.py
      - name: Commit clean final state
        run: |
          rm -f tools/refine-mobile-about-copy-158.py .github/workflows/refine-mobile-about-copy-158.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refine mobile About text rhythm"
            git push
          fi
