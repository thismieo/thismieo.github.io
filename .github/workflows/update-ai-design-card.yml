name: Update AI design card

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-ai-design-card.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update card copy safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<article class="workshop-card workshop-accent-indigo"><h3>Generative AI Media</h3><p>Creating and refining images, videos, and other digital media with AI tools through clear prompting, thoughtful iteration, and careful quality review.</p></article>'
          new = '<article class="workshop-card workshop-accent-indigo"><h3>AI Design &amp; Digital Creation</h3><p>Designing and building websites, creating digital visuals, and producing images and videos with AI tools through clear prompting, thoughtful iteration, and careful refinement.</p></article>'

          old_count = text.count(old)
          new_count = text.count(new)

          if old_count == 1 and new_count == 0:
              text = text.replace(old, new, 1)
              index.write_text(text, encoding='utf-8')
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(f'Unexpected card state: old={old_count}, new={new_count}')

          Path('.github/workflows/update-ai-design-card.yml').unlink(missing_ok=True)
          PY

          git diff --check
          grep -q '<h3>AI Design &amp; Digital Creation</h3>' index.html
          ! grep -q '<h3>Generative AI Media</h3>' index.html

      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh AI design and digital creation card'
          git push
