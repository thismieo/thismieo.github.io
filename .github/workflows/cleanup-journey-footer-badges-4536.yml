name: Clean Journey footer badge styles

on:
  push:
    paths:
      - '.github/workflows/cleanup-journey-footer-badges-4536.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Clean Journey footer badge styles
        run: python tools/cleanup-journey-footer-badges-4536.py
      - name: Commit clean final state
        run: |
          rm -f tools/cleanup-journey-footer-badges-4536.py
          rm -f .github/workflows/cleanup-journey-footer-badges-4536.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Journey footer badges"
          git push origin main
