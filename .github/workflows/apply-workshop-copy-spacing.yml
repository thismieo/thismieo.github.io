name: Apply Workshop copy and spacing

on:
  push:
    branches:
      - preview/workshop-copy-spacing

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified content and spacing changes
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"

          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '<link rel="stylesheet" href="styles.css?v=4.1.9.4">':
                  '<link rel="stylesheet" href="styles.css?v=4.1.9.5">',
              '<h2 id="foundation-title">Concepts that shape the path.</h2>':
                  '<h2 id="foundation-title">Concepts that shape the path.</h2>\n          <p class="workshop-block-description">Core ideas that build a clear foundation for everything ahead.</p>',
              '<h2 id="practice-title">Knowledge used in real workflows.</h2>':
                  '<h2 id="practice-title">Knowledge used in real workflows.</h2>\n          <p class="workshop-block-description">Turning learned concepts into practical, useful experience.</p>',
              '<h2 id="current-title"><span class="current-title-line">Python, one practical</span><span class="current-title-line">step at a time.</span></h2>':
                  '<h2 id="current-title"><span class="current-title-line">Python, one practical</span><span class="current-title-line">step at a time.</span></h2>\n          <p class="workshop-block-description workshop-block-description-current">Building confidence through logic, practice, and small programs that turn each new concept into real progress.</p>',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:80]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path("styles.css")
          text = path.read_text(encoding="utf-8")
          marker = "/* Editorial spacing and Workshop descriptions — August 2026 */"
          if marker in text:
              raise SystemExit("Editorial spacing block already exists")

          text += r'''

/* Editorial spacing and Workshop descriptions — August 2026 */
#journey .section-heading-row > p,
#projects .section-heading-row > p {
  margin-top: clamp(26px, 2.2vw, 32px);
}

.workshop-block-description {
  max-width: 640px;
  margin: 18px auto 0;
  color: #8ea2ab;
  font-size: clamp(0.9rem, 1.05vw, 0.98rem);
  font-weight: 480;
  line-height: 1.78;
  letter-spacing: -0.012em;
  text-align: center;
}

.workshop-block-description-current {
  max-width: 720px;
  color: #a6b8bf;
  font-weight: 560;
}

@media (max-width: 900px) {
  #journey .section-heading-row > p,
  #projects .section-heading-row > p {
    margin-top: 25px;
  }

  .workshop-block-description {
    max-width: 590px;
    margin-top: 17px;
  }
}

@media (max-width: 560px) {
  #journey .section-heading-row > p,
  #projects .section-heading-row > p {
    margin-top: 23px;
  }

  .workshop-block-description {
    max-width: 34rem;
    margin-top: 15px;
    font-size: 0.88rem;
    line-height: 1.72;
  }
}
'''
          path.write_text(text, encoding="utf-8")
          PY

          grep -q 'styles.css?v=4.1.9.5' index.html
          grep -q 'Core ideas that build a clear foundation for everything ahead.' index.html
          grep -q 'Turning learned concepts into practical, useful experience.' index.html
          grep -q 'Building confidence through logic, practice, and small programs that turn each new concept into real progress.' index.html
          grep -q 'Editorial spacing and Workshop descriptions' styles.css
          node --check script.js

          rm -rf .github
          git add -A
          tree="$(git write-tree)"
          test "$(git ls-tree -r --name-only "$tree" | wc -l | tr -d ' ')" = "18"
          test -z "$(git ls-tree -r --name-only "$tree" | grep -E '(^|/)(\.github|trigger|temp|payload|deploy-input)' || true)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit="$(printf '%s\n' 'Refine section spacing and add Workshop descriptions' | git commit-tree "$tree" -p "$base")"
          git push origin "${commit}:refs/heads/main" --force-with-lease="refs/heads/main:${base}"
          git push origin --delete "${GITHUB_REF_NAME}" || true
