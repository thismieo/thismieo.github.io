name: One-time title and spacing cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply title, spacing and cleanup refinements
        run: |
          printf '%s' '  ' | base64 --decode > /tmp/refine.py
          python3 /tmp/refine.py

      - name: Install responsive QA tooling
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Run responsive layout QA
        run: |
          python3 -m http.server 8000 >/tmp/site-server.log 2>&1 &
          printf '%s' '' | base64 --decode > /tmp/qa.py
          python3 /tmp/qa.py

      - name: Upload QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: title-spacing-cleanup-qa
          path: |
            qa-shots/*.png
            qa-metrics.json
          if-no-files-found: error

      - name: Commit final cleanup and remove temporary workflow
        run: |
          rm -f .github/workflows/one-time-title-spacing-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish title casing and section spacing"
          git push origin HEAD:main
