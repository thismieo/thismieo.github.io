name: One-time title and spacing cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinements safely
        run: |
          set +e
          python3 .github/scripts/refine_title_spacing.py > refine.log 2>&1
          echo "$?" > refine.status
          cat refine.log
          exit 0

      - name: Install responsive QA tooling
        run: |
          if [ "$(cat refine.status)" != "0" ]; then
            echo "Refinement did not complete; skipping browser QA."
            exit 0
          fi
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Run responsive QA safely
        run: |
          if [ "$(cat refine.status)" != "0" ]; then
            echo "1" > qa.status
            exit 0
          fi
          python3 -m http.server 8000 >/tmp/site-server.log 2>&1 &
          set +e
          python3 .github/scripts/qa_title_spacing.py > qa.log 2>&1
          echo "$?" > qa.status
          cat qa.log
          exit 0

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-spacing-cleanup-qa
          path: |
            refine.log
            refine.status
            qa.log
            qa.status
            qa-output/*.png
          if-no-files-found: warn

      - name: Commit cleanup and remove temporary files
        run: |
          if [ "$(cat refine.status)" != "0" ]; then
            git checkout -- index.html styles.css
          fi
          rm -rf qa-shots qa-output qa-metrics.json
          rm -f refine.log refine.status qa.log qa.status
          rm -f .github/scripts/refine_title_spacing.py
          rm -f .github/scripts/qa_title_spacing.py
          rm -f .github/workflows/one-time-title-spacing-cleanup.yml
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish title casing and section spacing"
          git push origin HEAD:main
