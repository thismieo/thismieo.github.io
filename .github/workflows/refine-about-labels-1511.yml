name: Refine About labels
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-about-labels-1511.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine About labels
        run: python .github/scripts/refine-about-labels-1511.py
      - name: Commit clean final state
        run: |
          rm -f .github/scripts/refine-about-labels-1511.py .github/workflows/refine-about-labels-1511.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Simplify About card labels"
            git push
          fi
# retry after tightening migration guard
