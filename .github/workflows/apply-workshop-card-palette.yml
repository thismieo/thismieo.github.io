name: Apply Workshop palette

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply palette
        run: python3 .github/apply_workshop_palette.py
      - name: Commit final state
        run: |
          rm .github/apply_workshop_palette.py
          rm .github/workflows/apply-workshop-card-palette.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop-integrated.css index.html .github/apply_workshop_palette.py .github/workflows/apply-workshop-card-palette.yml
          git commit -m "Refresh Workshop card surface palette"
          git push origin HEAD:main
