name: One-shot copy icon fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-copy-icon.yml

permissions:
  contents: write

concurrency:
  group: fix-copy-icon
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace both copy icons safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old = '<svg class="copy-icon" viewBox="0 0 24 24"><rect x="8" y="8" width="10" height="10" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>'
          new = '<svg class="copy-icon" viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10"/></svg>'

          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 old copy icons, found {count}.')

          text = text.replace(old, new)
          if text.count(new) != 2 or old in text:
              raise SystemExit('Copy icon replacement validation failed.')

          index.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-copy-icon.yml').unlink()
          PY

      - name: Verify exact diff
        run: |
          git diff --check
          test ! -e .github/workflows/fix-copy-icon.yml
          test "$(grep -o '<svg class="copy-icon" viewBox="0 0 24 24"><rect x="4" y="8" width="12" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10"/></svg>' index.html | wc -l)" -eq 2
          ! grep -q 'M6 15H5a2 2 0 0 1-2-2V5' index.html

      - name: Commit repaired icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair email copy icons'
          git push
