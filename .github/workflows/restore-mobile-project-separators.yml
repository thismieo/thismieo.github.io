name: Restore mobile project separators

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-mobile-project-separators.yml

permissions:
  contents: write

jobs:
  restore-mobile-separators:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add responsive project separators
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          css_path = Path('styles.css')
          index = index_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          start = index.index('        <div class="project-grid">')
          end = index.index('        </div>\n      </div>\n    </section>', start)
          block = index[start:end]

          if 'project-mobile-separator' not in block:
              articles = list(re.finditer(r'</article>', block))
              if len(articles) != 5:
                  raise SystemExit(f'Expected 5 project articles, found {len(articles)}')
              offset = 0
              for match in articles[:4]:
                  insert_at = match.end() + offset
                  separator = '\n          <span class="project-mobile-separator" aria-hidden="true"><span></span></span>'
                  block = block[:insert_at] + separator + block[insert_at:]
                  offset += len(separator)
              index = index[:start] + block + index[end:]

          marker = '/* Mobile project separators — August 2026 */'
          if marker not in css:
              css += '''\n\n/* Mobile project separators — August 2026 */\n.project-mobile-separator { display: none; }\n\n@media (max-width: 700px) {\n  .project-grid { gap: 0; }\n\n  .project-mobile-separator {\n    width: 100%;\n    min-height: 44px;\n    display: grid;\n    place-items: center;\n    pointer-events: none;\n  }\n\n  .project-mobile-separator > span {\n    width: min(72%, 320px);\n    height: 1px;\n    display: block;\n    background: var(--homepage-divider-line);\n    box-shadow: 0 0 12px rgba(145, 169, 178, 0.06);\n  }\n}\n'''

          index = index.replace('styles.css?v=4.3.6', 'styles.css?v=4.3.7')
          index = index.replace('Version 4.3.6', 'Version 4.3.7')

          if index.count('project-mobile-separator') != 4:
              raise SystemExit('Expected 4 mobile separators')
          if 'border-radius: 19px;' not in css:
              raise SystemExit('Rounded project card corners missing')
          if 'styles.css?v=4.3.7' not in index or 'Version 4.3.7' not in index:
              raise SystemExit('Version bump failed')

          index_path.write_text(index, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

          rm .github/workflows/restore-mobile-project-separators.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css .github
          git commit -m 'Restore horizontal project separators on mobile'
          git push
