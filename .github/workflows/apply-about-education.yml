name: Apply About education copy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update About education text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<dd class="about-education-value"><span>Studying at CIS College in the Diploma</span><span>of Artificial Intelligence Engineer</span></dd>'
          new = '<dd class="about-education-value"><span>Studying at CIS College toward a</span><span><strong>Diploma in Artificial Intelligence Engineering</strong></span></dd>'

          if old not in text:
              raise SystemExit("Expected About education copy was not found; no change made.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit the clean final state
        shell: bash
        run: |
          rm .github/workflows/apply-about-education.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-about-education.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refine About education copy"
          git push origin HEAD:main
