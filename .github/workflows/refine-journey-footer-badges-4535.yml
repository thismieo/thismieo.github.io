name: Refine Journey footer badges

on:
  push:
    paths:
      - '.github/workflows/refine-journey-footer-badges-4535.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Journey footer badge refinement
        run: python tools/apply-journey-footer-badges-4535.py
      - name: Commit clean final state
        run: |
          rm -f tools/apply-journey-footer-badges-4535.py
          rm -f .github/workflows/refine-journey-footer-badges-4535.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Journey footer badges"
          git push origin main
