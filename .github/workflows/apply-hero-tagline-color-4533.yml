name: Apply Hero tagline color identity

on:
  push:
    paths:
      - 'tools/apply-hero-tagline-color-4533.py'
      - '.github/workflows/apply-hero-tagline-color-4533.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Hero tagline color identity
        run: python tools/apply-hero-tagline-color-4533.py

      - name: Commit clean final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Hero tagline color identity"
          git push
