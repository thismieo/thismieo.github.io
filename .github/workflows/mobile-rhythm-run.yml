name: Mobile spacing refinement runner

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mobile-rhythm-run.yml"

permissions:
  contents: write

jobs:
  refine-mobile-rhythm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile spacing system
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path("styles.css")
          html_path = Path("index.html")
          css = css_path.read_text(encoding="utf-8")
          html = html_path.read_text(encoding="utf-8")

          marker = "/* Mobile vertical rhythm refinement — August 2026 */"
          block = "\n\n" + "\n".join([
              marker,
              "@media (max-width: 700px) {",
              "  :root {",
              "    --section-space: 34px;",
              "  }",
              "",
              "  /* Add breathing room after the actions, then tighten the transition below the portrait. */",
              "  .hero {",
              "    gap: 36px;",
              "    padding-bottom: 24px;",
              "  }",
              "",
              "  /* The portrait-to-About transition is intentionally more compact than other section changes. */",
              "  .about {",
              "    padding-top: 24px;",
              "    padding-bottom: 34px;",
              "  }",
              "",
              "  /* Keep the remaining homepage transitions on one consistent vertical rhythm. */",
              "  .journey,",
              "  .projects,",
              "  .contact,",
              "  .closing-note {",
              "    padding-block: 34px;",
              "  }",
              "}",
          ]) + "\n"

          if marker not in css:
              css = css.rstrip() + block

          if "Blue Continuum 4.2.6" in css:
              css = css.replace("Blue Continuum 4.2.6", "Blue Continuum 4.2.7", 1)
          if 'styles.css?v=4.2.6' in html:
              html = html.replace('styles.css?v=4.2.6', 'styles.css?v=4.2.7', 1)
          if 'Version 4.2.6' in html:
              html = html.replace('Version 4.2.6', 'Version 4.2.7', 1)

          for token in (
              "Blue Continuum 4.2.7",
              marker,
              "--section-space: 34px",
              "gap: 36px",
              "padding-bottom: 24px",
          ):
              if token not in css:
                  raise RuntimeError(f"Missing CSS token: {token}")
          if 'styles.css?v=4.2.7' not in html or 'Version 4.2.7' not in html:
              raise RuntimeError("HTML version bump was not applied")
          if css.count("{") != css.count("}"):
              raise RuntimeError("CSS braces are unbalanced")
          if html.count("<section") != html.count("</section>"):
              raise RuntimeError("HTML section tags are unbalanced")

          css_path.write_text(css, encoding="utf-8")
          html_path.write_text(html, encoding="utf-8")
          print("mobile_spacing_refinement=success")
          PY

      - name: Install responsive audit tooling
        continue-on-error: true
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium

      - name: Audit responsive section rhythm
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PY' > mobile-rhythm-audit.log 2>&1
          from pathlib import Path
          import json
          import subprocess
          import time
          from playwright.sync_api import sync_playwright

          output = Path("mobile-rhythm-audit")
          output.mkdir(exist_ok=True)
          server = subprocess.Popen(
              ["python3", "-m", "http.server", "4173", "--bind", "127.0.0.1"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          time.sleep(1.2)

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  results = {}
                  viewports = (
                      ("desktop", 1440, 1000),
                      ("tablet", 768, 900),
                      ("mobile", 390, 844),
                      ("small-mobile", 360, 800),
                  )
                  for name, width, height in viewports:
                      page = browser.new_page(viewport={"width": width, "height": height})
                      page.goto("http://127.0.0.1:4173", wait_until="networkidle")
                      page.evaluate("document.fonts.ready")
                      page.evaluate("document.activeElement && document.activeElement.blur()")
                      metrics = page.evaluate("""
                      () => {
                        const rect = (selector) => document.querySelector(selector).getBoundingClientRect();
                        const heroCopy = rect('.hero-copy');
                        const portrait = rect('.portrait-frame');
                        const aboutHeading = rect('#about .section-heading');
                        const aboutFacts = rect('#about .facts');
                        const journeyHeading = rect('#journey .section-heading');
                        const journeyEnd = rect('#journey .workshop-entry-shimmer');
                        const projectsHeading = rect('#projects .section-heading');
                        const projectsGrid = rect('#projects .project-grid');
                        const contactHeading = rect('#contact .contact-copy');
                        const contactLinks = rect('#contact .contact-links');
                        const closingHeading = rect('#closing .closing-note-copy');
                        const heroStyle = getComputedStyle(document.querySelector('.hero'));
                        const rootStyle = getComputedStyle(document.documentElement);
                        return {
                          overflow: document.documentElement.scrollWidth - window.innerWidth,
                          heroRowGap: portrait.top - heroCopy.bottom,
                          portraitToAbout: aboutHeading.top - portrait.bottom,
                          aboutToJourney: journeyHeading.top - aboutFacts.bottom,
                          journeyToProjects: projectsHeading.top - journeyEnd.bottom,
                          projectsToContact: contactHeading.top - projectsGrid.bottom,
                          contactToClosing: closingHeading.top - contactLinks.bottom,
                          heroPaddingBottom: heroStyle.paddingBottom,
                          sectionSpace: rootStyle.getPropertyValue('--section-space').trim(),
                        };
                      }
                      """)
                      results[name] = metrics
                      assert metrics["overflow"] <= 1, metrics
                      if width <= 700:
                          assert 34 <= metrics["heroRowGap"] <= 38, metrics
                          assert 54 <= metrics["portraitToAbout"] <= 62, metrics
                          for key in (
                              "aboutToJourney",
                              "journeyToProjects",
                              "projectsToContact",
                              "contactToClosing",
                          ):
                              assert 64 <= metrics[key] <= 72, (key, metrics)
                          assert metrics["heroPaddingBottom"] == "24px", metrics
                          assert metrics["sectionSpace"] == "34px", metrics

                      page.locator('.hero').screenshot(path=output / f"{name}-hero.png")
                      page.locator('#about').screenshot(path=output / f"{name}-about.png")
                      page.locator('#journey').screenshot(path=output / f"{name}-journey.png")
                      page.screenshot(path=output / f"{name}-full-page.png", full_page=True)
                      page.close()

                  (output / "metrics.json").write_text(json.dumps(results, indent=2), encoding="utf-8")
                  browser.close()
              print("responsive_audit=success")
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
          echo "audit_exit=$?" >> mobile-rhythm-audit.log
          exit 0

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: mobile-rhythm-audit
          path: |
            mobile-rhythm-audit
            mobile-rhythm-audit.log
          if-no-files-found: ignore

      - name: Commit refinement and clean temporary workflows
        run: |
          rm -rf mobile-rhythm-audit
          rm -f mobile-rhythm-audit.log
          rm -f .github/workflows/mobile-rhythm-run.yml
          rm -f .github/workflows/one-time-mobile-rhythm.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine mobile section spacing" || true
          git push
