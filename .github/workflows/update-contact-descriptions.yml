name: Update contact card descriptions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-contact-descriptions.yml"

permissions:
  contents: write

jobs:
  update-contact-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace visible email addresses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          replacements = {
              '<span class="contact-card-purpose">thismieo@outlook.com</span>':
                  '<span class="contact-card-purpose">Private messages &amp; direct contact</span>',
              '<span class="contact-card-purpose">thismieo@gmail.com</span>':
                  '<span class="contact-card-purpose">Work &amp; general inquiries</span>',
              'data-copy-label="Copy Outlook email address" aria-label="Copy Outlook email address"':
                  'data-copy-label="Copy private Outlook address" aria-label="Copy private Outlook address"',
              'data-copy-label="Copy Gmail address" aria-label="Copy Gmail address"':
                  'data-copy-label="Copy work and general Gmail address" aria-label="Copy work and general Gmail address"',
              '<p class="footer-version">Version 4.2.7</p>':
                  '<p class="footer-version">Version 4.2.8</p>',
          }

          for old, new in replacements.items():
              count = html.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match for {old!r}, found {count}")
              html = html.replace(old, new, 1)

          for visible_email in (
              '<span class="contact-card-purpose">thismieo@outlook.com</span>',
              '<span class="contact-card-purpose">thismieo@gmail.com</span>',
          ):
              if visible_email in html:
                  raise RuntimeError("A visible email address remains in a contact card")

          for copy_value in (
              'data-copy-email="thismieo@outlook.com"',
              'data-copy-email="thismieo@gmail.com"',
          ):
              if copy_value not in html:
                  raise RuntimeError("Copy functionality email value was removed")

          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit update and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-contact-descriptions.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace visible contact emails with descriptions"
          git push
