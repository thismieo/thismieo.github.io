name: Apply Workshop palette 6.0.14

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply palette migration
        run: python tools/apply_workshop_palette_6014.py

      - name: Commit final state
        run: |
          rm tools/apply_workshop_palette_6014.py
          rm .github/workflows/apply-workshop-palette-6014.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop-integrated.css index.html tools/apply_workshop_palette_6014.py .github/workflows/apply-workshop-palette-6014.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Workshop color system"
          git push origin HEAD:main
