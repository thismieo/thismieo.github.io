name: Refine About intro

on:
  push:
    branches:
      - main
    paths:
      - .github/refine-about-intro.trigger

permissions:
  contents: write

concurrency:
  group: refine-about-intro
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded About refinement
        run: python .github/scripts/refine_about_intro.py

      - name: Remove one-shot files
        run: |
          rm -f .github/refine-about-intro.trigger
          rm -f .github/scripts/refine_about_intro.py
          rm -f .github/workflows/refine-about-intro.yml

      - name: Commit refined About intro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine centered About introduction"
          git push
