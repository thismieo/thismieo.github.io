name: Update Hero role wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-hero-role-4533.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Hero role wording
        run: python .github/scripts/update-hero-role-4533.py
      - name: Commit clean final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Refine Hero role wording"
          git push
