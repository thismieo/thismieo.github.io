name: Refine Workshop motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-workshop-motion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply calm interaction system
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          js_path = Path('workshop-integrated.js')
          css_path = Path('workshop-integrated.css')
          html_path = Path('index.html')

          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          state_old = '''  const activeIndex = { featured: 0, archive: 0 };
  let openGroupName = "";
  let copyTimer = 0;
'''
          state_new = '''  const activeIndex = { featured: 0, archive: 0 };
  let openGroupName = "";
  let copyTimer = 0;
  let interactionToken = 0;
  let scrollFrame = 0;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const interactionMotion = Object.freeze({ reveal: 285, close: 225, scroll: 360 });
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const nextFrame = () => new Promise((resolve) => window.requestAnimationFrame(resolve));
  const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

  const smoothScrollTo = (targetY, maxDuration = interactionMotion.scroll) => new Promise((resolve) => {
    window.cancelAnimationFrame(scrollFrame);
    const startY = window.scrollY;
    const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    const endY = clamp(targetY, 0, maxY);
    const distance = endY - startY;

    if (reduceMotion || Math.abs(distance) < 2) {
      window.scrollTo(0, endY);
      resolve();
      return;
    }

    const duration = clamp(Math.abs(distance) * 1.15, 220, maxDuration);
    const startedAt = performance.now();
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);

    const step = (now) => {
      const progress = clamp((now - startedAt) / duration, 0, 1);
      window.scrollTo(0, startY + distance * easeOut(progress));
      if (progress < 1) scrollFrame = window.requestAnimationFrame(step);
      else resolve();
    };

    scrollFrame = window.requestAnimationFrame(step);
  });
'''
          if js.count(state_old) != 1:
              raise SystemExit('Workshop JS state anchor mismatch')
          js = js.replace(state_old, state_new, 1)

          behavior_old = '''  const setSlot = (name, open) => {
    const slot = slots[name];
    slot.style.removeProperty("height");
    slot.classList.remove("is-settled", "is-closing");
    slot.classList.toggle("is-open", open);
    slot.hidden = !open;
    slot.setAttribute("aria-hidden", String(!open));
  };

  const toggleGroup = (name) => {
    if (!groups[name]) return;
    if (openGroupName === name) {
      setSlot(name, false);
      openGroupName = "";
      syncCollectionState();
      return;
    }

    if (openGroupName) setSlot(openGroupName, false);
    openGroupName = name;
    setSlot(name, true);
    renderDetail(name, activeIndex[name], 0);
    syncCollectionState();
  };

  buttons.forEach((button) => {
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleGroup(button.dataset.practiceGroup);
    });
  });
'''

          behavior_new = '''  const buttonFor = (name) => buttons.find((button) => button.dataset.practiceGroup === name);
  const cardFor = (name) => buttonFor(name)?.closest("[data-practice-card]");

  const setSlotImmediate = (name, open) => {
    const slot = slots[name];
    slot.style.removeProperty("height");
    slot.classList.remove("is-settled", "is-closing");
    slot.classList.toggle("is-open", open);
    slot.hidden = !open;
    slot.inert = !open;
    slot.setAttribute("aria-hidden", String(!open));
  };

  const preserveViewportAnchor = (element, beforeTop) => {
    if (!element || !Number.isFinite(beforeTop)) return;
    const afterTop = element.getBoundingClientRect().top;
    const shift = afterTop - beforeTop;
    if (Math.abs(shift) > 0.5) window.scrollBy(0, shift);
  };

  const gentlyAlignOpenContent = async (name) => {
    const card = cardFor(name);
    const controls = explorers[name]?.querySelector(".practice-swipe-controls");
    if (!card || !controls) return;

    const viewportHeight = window.innerHeight;
    const cardRect = card.getBoundingClientRect();
    const controlsRect = controls.getBoundingClientRect();
    const safeTop = window.innerWidth <= 700 ? 78 : 88;
    const safeBottom = viewportHeight - (window.innerWidth <= 700 ? 24 : 32);
    let delta = 0;

    if (cardRect.top < safeTop - 22) {
      delta = cardRect.top - safeTop;
    } else if (controlsRect.bottom > safeBottom) {
      delta = controlsRect.bottom - safeBottom + 8;
    }

    const limit = window.innerWidth <= 700 ? 138 : 112;
    delta = clamp(delta, -limit, limit);
    if (Math.abs(delta) >= 10) await smoothScrollTo(window.scrollY + delta);
  };

  const gentlySettleClosedCard = async (name) => {
    const card = cardFor(name);
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const safeTop = window.innerWidth <= 700 ? 72 : 82;
    const lowerBound = window.innerHeight * 0.72;
    let delta = 0;

    if (rect.top < safeTop - 24) delta = rect.top - safeTop;
    else if (rect.top > lowerBound) delta = rect.top - lowerBound;

    delta = clamp(delta, -84, 84);
    if (Math.abs(delta) >= 12) await smoothScrollTo(window.scrollY + delta, 300);
  };

  const openSlot = async (name, token) => {
    const slot = slots[name];
    slot.hidden = false;
    slot.inert = false;
    slot.classList.remove("is-closing", "is-settled");
    slot.classList.remove("is-open");
    slot.setAttribute("aria-hidden", "false");

    await nextFrame();
    if (token != interactionToken) return false;
    slot.classList.add("is-open");
    return true;
  };

  const closeSlot = async (name, token, anchorElement = null, anchorTop = NaN) => {
    const slot = slots[name];
    if (slot.hidden) return true;

    slot.inert = true;
    slot.setAttribute("aria-hidden", "true");
    slot.classList.add("is-closing");
    slot.classList.remove("is-open", "is-settled");

    if (!reduceMotion) await wait(interactionMotion.close);
    if (token != interactionToken) return false;

    slot.hidden = true;
    slot.classList.remove("is-closing");
    preserveViewportAnchor(anchorElement, anchorTop);
    return true;
  };

  const normalizeInterruptedSlots = () => {
    Object.entries(slots).forEach(([name, slot]) => {
      if (!slot.classList.contains("is-closing")) return;
      const shouldBeOpen = name === openGroupName;
      setSlotImmediate(name, shouldBeOpen);
    });
  };

  const toggleGroup = async (name) => {
    if (!groups[name]) return;
    const token = ++interactionToken;
    normalizeInterruptedSlots();

    if (openGroupName === name) {
      openGroupName = "";
      syncCollectionState();
      const closed = await closeSlot(name, token);
      if (closed && token === interactionToken) await gentlySettleClosedCard(name);
      return;
    }

    const previous = openGroupName;
    const targetCard = cardFor(name);
    const targetTop = targetCard?.getBoundingClientRect().top ?? NaN;
    openGroupName = name;
    syncCollectionState();

    if (previous) {
      const closed = await closeSlot(previous, token, targetCard, targetTop);
      if (!closed || token !== interactionToken) return;
    }

    renderDetail(name, activeIndex[name], 0);
    const opened = await openSlot(name, token);
    if (!opened || token !== interactionToken) return;

    if (!reduceMotion) await wait(36);
    if (token === interactionToken) await gentlyAlignOpenContent(name);
  };

  buttons.forEach((button) => {
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      void toggleGroup(button.dataset.practiceGroup);
    });
  });
'''
          if js.count(behavior_old) != 1:
              raise SystemExit('Workshop JS behavior anchor mismatch')
          js = js.replace(behavior_old, behavior_new, 1)
          js = js.replace('    setSlot(name, false);\n', '    setSlotImmediate(name, false);\n')

          css_anchor = '''.knowledge-application-merged .workshop-subgroup-applied {
  margin-top: clamp(64px, 7vw, 88px) !important;
}
'''
          css_add = css_anchor + '''
/* Unified interaction timing: same calm response for both outer practice cards. */
.practice-milestone {
  transition-duration: 250ms !important;
  transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;
}

.practice-milestone-action,
.practice-action-chevron {
  transition-duration: 185ms !important;
  transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;
}
'''
          if css.count(css_anchor) != 1:
              raise SystemExit('Workshop CSS timing anchor mismatch')
          css = css.replace(css_anchor, css_add, 1)

          reveal_old = '''.practice-explorer-slot[hidden] {
  display: none !important;
}

.practice-explorer-slot,
.practice-explorer-slot.is-open,
.practice-explorer-slot.is-settled {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  min-width: 0 !important;
  min-height: 0 !important;
  grid-template-rows: none !important;
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  transform: none !important;
  overflow: visible !important;
  will-change: auto !important;
  transition: none !important;
}

.practice-explorer-slot-inner,
.practice-explorer-slot.is-open > .practice-explorer-slot-inner {
  min-width: 0 !important;
  min-height: 0 !important;
  padding-top: 12px !important;
  overflow: visible !important;
  transition: none !important;
}
'''
          reveal_new = '''.practice-explorer-slot[hidden] {
  display: none !important;
}

.practice-explorer-slot,
.practice-explorer-slot.is-open,
.practice-explorer-slot.is-settled,
.practice-explorer-slot.is-closing {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  min-width: 0 !important;
  min-height: 0 !important;
  grid-template-rows: none !important;
  opacity: 1 !important;
  visibility: visible !important;
  transform: none !important;
  overflow: visible !important;
  overflow-anchor: none !important;
  will-change: auto !important;
  transition: none !important;
}

.practice-explorer-slot {
  pointer-events: none !important;
}

.practice-explorer-slot.is-open {
  pointer-events: auto !important;
}

.practice-explorer-slot-inner {
  min-width: 0 !important;
  min-height: 0 !important;
  padding-top: 12px !important;
  overflow: visible !important;
  opacity: 0;
  transform: translate3d(0, -6px, 0);
  transition:
    opacity 250ms cubic-bezier(0.22, 1, 0.36, 1),
    transform 285ms cubic-bezier(0.22, 1, 0.36, 1) !important;
}

.practice-explorer-slot.is-open > .practice-explorer-slot-inner {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}

.practice-explorer-slot.is-closing > .practice-explorer-slot-inner {
  opacity: 0;
  transform: translate3d(0, -4px, 0);
  transition-duration: 205ms, 225ms !important;
}
'''
          if css.count(reveal_old) != 1:
              raise SystemExit('Workshop CSS reveal anchor mismatch')
          css = css.replace(reveal_old, reveal_new, 1)

          css = css.replace('animation: practice-card-from-right 190ms', 'animation: practice-card-from-right 235ms')
          css = css.replace('animation: practice-card-from-left 190ms', 'animation: practice-card-from-left 235ms')
          css = css.replace('animation: practice-card-soft-in 160ms', 'animation: practice-card-soft-in 210ms')
          css = css.replace('translateX(12px)', 'translateX(8px)')
          css = css.replace('translateX(-12px)', 'translateX(-8px)')
          css = css.replace('translateY(3px)', 'translateY(2px)')
          css = css.replace('transform: scale(0.95);', 'transform: scale(0.97);')

          reduced_old = '''  .practice-swipe-arrow,
  .practice-swipe-dots i {
    transition: none !important;
  }
'''
          reduced_new = '''  .practice-explorer-slot-inner,
  .practice-explorer-slot.is-open > .practice-explorer-slot-inner,
  .practice-explorer-slot.is-closing > .practice-explorer-slot-inner,
  .practice-milestone,
  .practice-milestone-action,
  .practice-action-chevron,
  .practice-swipe-arrow,
  .practice-swipe-dots i {
    transition: none !important;
  }
'''
          if css.count(reduced_old) != 1:
              raise SystemExit('Workshop reduced-motion anchor mismatch')
          css = css.replace(reduced_old, reduced_new, 1)

          replacements = {
              'workshop-integrated.css?v=5.0.0': 'workshop-integrated.css?v=5.2.0',
              'workshop-integrated.js?v=5.0.0': 'workshop-integrated.js?v=5.2.0',
          }
          for old, new in replacements.items():
              if html.count(old) != 1:
                  raise SystemExit(f'Index cache-bust anchor mismatch: {old}')
              html = html.replace(old, new, 1)

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

          node --check workshop-integrated.js
          grep -q 'interactionMotion = Object.freeze' workshop-integrated.js
          grep -q 'gentlyAlignOpenContent' workshop-integrated.js
          grep -q 'preserveViewportAnchor' workshop-integrated.js
          ! grep -q 'scrollIntoView' workshop-integrated.js
          ! grep -q 'scrollHeight' workshop-integrated.js
          grep -q 'overflow-anchor: none' workshop-integrated.css
          grep -q 'workshop-integrated.css?v=5.2.0' index.html
          grep -q 'workshop-integrated.js?v=5.2.0' index.html

          rm -rf .github

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Workshop open close and scroll motion'
          git push origin HEAD:main
