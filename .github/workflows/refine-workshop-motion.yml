name: Refine Workshop motion

on:
  push:
    branches: [main]
    paths:
      - .workshop-motion-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verify and clean
        shell: bash
        run: |
          set -euo pipefail
          cat .workshop-motion-patch-*.part | base64 -d > /tmp/workshop-motion-patch.py
          python3 /tmp/workshop-motion-patch.py
          node --check workshop-integrated.js
          grep -q 'interactionMotion = Object.freeze' workshop-integrated.js
          grep -q 'gentlyAlignOpenContent' workshop-integrated.js
          grep -q 'preserveViewportAnchor' workshop-integrated.js
          ! grep -q 'scrollIntoView' workshop-integrated.js
          ! grep -q 'scrollHeight' workshop-integrated.js
          grep -q 'overflow-anchor: none' workshop-integrated.css
          grep -q 'workshop-integrated.css?v=5.2.0' index.html
          grep -q 'workshop-integrated.js?v=5.2.0' index.html
          rm -rf .github .workshop-motion-patch* .workshop-motion-ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Workshop open close and scroll motion'
          git push origin HEAD:main
