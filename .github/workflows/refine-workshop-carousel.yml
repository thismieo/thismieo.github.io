name: Refine Workshop carousel interaction

on:
  push:
    branches: [main]
    paths:
      - .workshop-carousel-patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply, verify, and clean
        shell: bash
        run: |
          set -euo pipefail
          python3 .workshop-carousel-patch.py
          node --check workshop-integrated.js
          grep -q 'practice-carousel-viewport' workshop-integrated.css
          grep -q 'scroll-snap-type: x mandatory' workshop-integrated.css
          grep -q 'stabilizeWorkshopBackground' workshop-integrated.js
          grep -q 'buildCarousel' workshop-integrated.js
          ! grep -q 'touchend' workshop-integrated.js
          ! grep -q 'renderDetail(name' workshop-integrated.js
          grep -q 'workshop-integrated.css?v=5.3.0' index.html
          grep -q 'workshop-integrated.js?v=5.3.0' index.html
          rm -rf .github .workshop-carousel-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Workshop carousel and background stability'
          git push origin HEAD:main