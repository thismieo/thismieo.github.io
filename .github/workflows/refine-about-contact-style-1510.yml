name: Refine About contact-style cards
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-about-contact-style-1510.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine About cards
        run: python tools/refine-about-contact-style-1510.py
      - name: Commit clean final state
        run: |
          rm -f tools/refine-about-contact-style-1510.py .github/workflows/refine-about-contact-style-1510.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Soften About cards and remove icon glass frames"
            git push
          fi
