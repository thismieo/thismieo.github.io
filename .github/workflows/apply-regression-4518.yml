name: Apply regression repair 4.5.18

on:
  push:
    branches: [fix/regression-audit-4518]

permissions:
  contents: write
  pages: write

jobs:
  audit-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/regression-audit-4518
          fetch-depth: 0

      - name: Repair, deeply audit, and publish clean production commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE: 0680ffb25e9553d38013c23c5a885e5686d24070
        run: |
          set -euo pipefail
          cp .github/scripts/apply_regression_4518.py /tmp/apply_regression_4518.py
          cp .github/scripts/audit_regression_4518.mjs /tmp/audit_regression_4518.mjs

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASELINE"
          git checkout -B regression-work "$BASELINE"

          python3 /tmp/apply_regression_4518.py

          node --check script.js
          node --check workshop-integrated.js
          node --check interactions.js
          git diff --check

          # Structural ownership checks: no known regression patterns may survive.
          ! grep -q 'workshop-grid-foundation > .knowledge-card:nth-child(' workshop-integrated.css
          grep -q 'workshop-grid-foundation > .knowledge-card:nth-of-type(3)' workshop-integrated.css
          grep -q 'workshop-grid-foundation > .knowledge-card:nth-of-type(4)' workshop-integrated.css
          ! grep -q 'workshop-grid-foundation > .knowledge-card:not(:last-child)::after' visual-system.css
          grep -A6 '.portfolio-panel .project-mobile-separator > span {' visual-system.css | grep -q 'height: 1px !important;'
          grep -A6 '.portfolio-panel .project-mobile-separator > span {' visual-system.css | grep -q 'display: block !important;'
          grep -q 'const workshopEntryAction = target.closest(".workshop-entry-action")' interactions.js
          grep -q '".practice-selector-card", ".knowledge-card"' interactions.js

          # CSS brace sanity.
          python3 - <<'PY'
          from pathlib import Path
          for name in ['styles.css','contact-linkedin.css','workshop-integrated.css','visual-system.css','interactions.css']:
              text=Path(name).read_text(encoding='utf-8')
              depth=0
              in_str=None
              esc=False
              in_comment=False
              i=0
              while i < len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if in_comment:
                      if c=='*' and n=='/': in_comment=False; i+=2; continue
                      i+=1; continue
                  if in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==in_str: in_str=None
                      i+=1; continue
                  if c=='/' and n=='*': in_comment=True; i+=2; continue
                  if c in "'\"": in_str=c; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}': depth-=1
                  if depth < 0: raise SystemExit(f'{name}: closing brace underflow')
                  i+=1
              if depth != 0: raise SystemExit(f'{name}: brace depth {depth}')
          print('CSS brace audit: OK')
          PY

          # Duplicate IDs in production HTML.
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          if dup: raise SystemExit('Duplicate IDs: '+', '.join(dup))
          print('HTML duplicate-ID audit: OK')
          PY

          # Browser regression audit on actual computed styles and rendered geometry.
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/4518-http.log 2>&1 &
          HTTP_PID=$!
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/chrome-4518 about:blank >/tmp/4518-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID $HTTP_PID 2>/dev/null || true' EXIT
          node /tmp/audit_regression_4518.mjs
          kill $CHROME_PID $HTTP_PID 2>/dev/null || true
          trap - EXIT

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 404.html CHANGELOG.md index.html interactions.js visual-system.css workshop-integrated.css | sort)"
          test "$changed" = "$expected"

          # Temporary audit machinery must never enter the production tree.
          rm -rf .github
          git add -A
          test -z "$(git status --porcelain | grep -E '(^|/)(\.github|regression_4518|regression-audit)' || true)"
          tree="$(git write-tree)"
          test -z "$(git ls-tree -r --name-only "$tree" | grep -E '(^|/)(\.github|\.run-|temp|payload)' || true)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit="$(printf '%s\n' 'Repair visual regressions and interaction timing' | git commit-tree "$tree" -p "$BASELINE")"
          git push origin "${commit}:refs/heads/main" --force-with-lease="refs/heads/main:${BASELINE}"

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

          echo "FINAL_COMMIT=$commit"
