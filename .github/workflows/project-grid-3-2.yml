name: Build project grid

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-grid-3-2.yml'

permissions:
  contents: write

jobs:
  update-project-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild project section
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/update-project-grid.py
          python /tmp/update-project-grid.py

      - name: Commit layout and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/project-grid-3-2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css .github
          git commit -m 'Rebuild projects as a 3+2 grid'
          git push
