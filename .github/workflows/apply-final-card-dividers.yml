name: Apply final card dividers

on:
  push:
    branches:
      - main
    paths:
      - .github/final-card-dividers.trigger

permissions:
  contents: write

concurrency:
  group: apply-final-card-dividers
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply guarded layout changes
        run: python .github/scripts/apply_final_card_dividers.py

      - name: Remove one-shot files
        run: |
          rm -f .github/final-card-dividers.trigger
          rm -f .github/scripts/apply_final_card_dividers.py
          rm -f .github/workflows/apply-final-card-dividers.yml

      - name: Commit final layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Workshop and Projects divider layout"
          git push
